
- name: Setting up webservers
  hosts: webservers
  tasks:
  - name: Ping available hosts
    ping:

  - name: Add webadmin users
    become: yes
    user: 
      name: webadmin

  - name: Update apt-get repo and cache
    become: yes
    apt: update_cache=yes force_apt_get=yes cache_valid_time=3600

  - name: install nginx
    become: yes
    apt: 
      name: nginx
      state: latest
  - name: start nginx
    become: yes
    service: 
      name: nginx
      state: started